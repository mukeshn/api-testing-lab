version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      playwright:
        patterns: ["@playwright/*", "playwright*"]
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "maven"
    directory: "/java"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
