name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Start system under test
        run: |
          node sut/server.mjs > sut.log 2>&1 &
          npx --yes wait-on@8 http://localhost:4173/health
      - run: mvn -B -ntp -f java/pom.xml verify
      - uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'java/**/target/surefire-reports/TEST-*.xml'
